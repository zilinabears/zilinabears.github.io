<circle cx='556' cy='238' r='14' fill='#1f5fa8' fill-opacity='1' stroke='#ffffff' stroke-width='2.5'/>
<circle cx='656' cy='220' r='14' fill='#e07b39' fill-opacity='1' stroke='#ffffff' stroke-width='2.5'/>
