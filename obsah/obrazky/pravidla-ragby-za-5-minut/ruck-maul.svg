<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 420' width='800' height='420' role='img' aria-label='Ruck a maul: lopta na zemi verzus lopta v rukách' font-family='Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>
<title>Ruck a maul: lopta na zemi verzus lopta v rukách</title>
