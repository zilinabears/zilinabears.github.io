<text x='590' y='320' font-size='14' fill='#1d2a1d' text-anchor='middle' font-weight='bold'>– celý zhluk sa hýbe po ihrisku</text>
<circle cx='60' cy='395' r='14' fill='#1f5fa8' fill-opacity='1' stroke='#ffffff' stroke-width='2.5'/>
