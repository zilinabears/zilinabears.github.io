<circle cx='210' cy='395' r='14' fill='#e07b39' fill-opacity='1' stroke='#ffffff' stroke-width='2.5'/>
<text x='232' y='400' font-size='14' fill='#1d2a1d' text-anchor='start' font-weight='normal'>súper</text>
<ellipse cx='310' cy='395' rx='9' ry='6' fill='#f4d03f' stroke='#7a5a10' stroke-width='1.8' transform='rotate(-20 310 395)'/>
