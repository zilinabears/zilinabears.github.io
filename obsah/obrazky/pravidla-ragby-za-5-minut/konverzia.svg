<ellipse cx='400.0' cy='240' rx='9.9' ry='6.6000000000000005' fill='#f4d03f' stroke='#7a5a10' stroke-width='1.8' transform='rotate(90 400.0 240)'/>
<line x1='400.0' y1='228' x2='400.0' y2='142' stroke='#4a5a4a' stroke-width='2' stroke-dasharray='3 5' marker-end='url(#aTXT)'/>
<text x='386.0' y='290' font-size='15' fill='#1e8a45' text-anchor='end' font-weight='bold'>ľahký kop</text>
<text x='386.0' y='310' font-size='13' fill='#4a5a4a' text-anchor='end' font-weight='normal'>spredu</text>
<text x='400.0' y='508' font-size='14' fill='#4a5a4a' text-anchor='middle' font-weight='normal'>Kopáč si vyberie, ako ďaleko na čiare loptu postaví – ale vždy v línii s miestom položenia.</text>
</svg>
